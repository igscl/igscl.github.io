<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;700&display=swap">
    <link rel="stylesheet" href="./src/styles.css">
    <title>Ignacio Giadach</title>
</head>
<body>
    <main>
        <header>
            <h1>Hi there</h1>
            <p class="sub">(it's Ignacio)</p>
        </header>
        <nav>
            <button type="button" id="contact">email</button>
            <a href="https://github.com/igscl">github</a>
        </nav>
    </main>
    <script>
        (() => {
            const a = [0x9f, 0x0c, 0x0f, 0xdc, 0xc2, 0x4a, 0xcd, 0x0b];
            const b = [0xf2, 0x6e, 0xd4, 0x27, 0xf7, 0xd2, 0x87, 0xb5];
            const c = [0x68, 0x9d, 0xd2, 0x8f, 0xb6, 0x26, 0x99, 0x5c, 0x8f];
            const reveal = (e) => {
                e.preventDefault();
                const buf = a.concat(b, c);
                let s = buf[0];
                let out = '';
                for (let i = 1; i < buf.length; i++) {
                    const x = (buf[i] - s) & 0xff;
                    out += String.fromCharCode(x);
                    s = (s * 31 + x) & 0xff;
                }
                location.href = out;
            };
            document.getElementById('contact').addEventListener('pointerup', reveal);
        })();
    </script>
</body>
</html>
